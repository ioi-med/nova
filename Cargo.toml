[package]
name = "nova"
version = "1.3.2"
edition = "2021"
rust-version = "1.85"
authors = ["Nova"]
description = "Nova — navigateur web à onglets verticaux (WebView2 / Chromium), écrit en Rust avec un accélérateur natif C"
license = "MIT"
build = "build.rs"
exclude = ["target", "dist"]

[features]
default = ["native-accel"]
# Accélérateur natif écrit en C (compilé par clang-cl sous Windows).
# Désactivable avec --no-default-features si aucune chaîne C n'est disponible.
native-accel = ["dep:cc"]

[dependencies]
# La fonctionnalité « devtools » est nécessaire en release : wry ne l'expose
# par défaut que lorsque debug_assertions est actif.
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
dirs = "6"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Boîte de dialogue « ouvrir un fichier » (import des données d'un autre
# navigateur). Sans fonctionnalité de plateforme : l'implémentation Windows est
# autonome, rien n'est compilé pour les autres systèmes.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = { version = "1", optional = true }
# Les dépendances de script de compilation sont résolues pour la machine hôte :
# `winresource` doit donc être déclaré sans condition de cible.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Le crate `windows` (Win32) est volumineux à compiler : on désactive les
# informations de débogage pour diviser par ~3 l'empreinte mémoire de rustc.
[profile.dev]
debug = false
debug-assertions = true
