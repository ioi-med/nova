<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Nova — barre d'outils</title>
<style>
  :root{
    --bg:#1a1b1f; --bg-2:#202127; --bg-hover:#26272e;
    --text:#eceef2; --muted:#9a9ca7; --line:#2b2c33; --line-2:#35363e;
    --accent:#6b75e8; --accent-2:#6b75e8; --danger:#e5534b;
    --font:"Segoe UI Variable Text","Segoe UI",Inter,-apple-system,system-ui,Roboto,sans-serif;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8; --bg-2:#eceef2; --bg-hover:#e4e6ec;
    --text:#15161a; --muted:#5f616d; --line:#e2e4e9; --line-2:#d5d8de;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px;
    overflow:hidden; user-select:none;
  }
  .bar{display:flex;align-items:center;gap:4px;height:100%;padding:6px 10px 6px 8px;position:relative}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .nav{display:flex;align-items:center;gap:1px}
  .icon-btn{
    width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;
    justify-content:center;color:var(--muted);
  }
  .icon-btn:hover{background:var(--bg-hover);color:var(--text)}
  .icon-btn:disabled{opacity:.35;cursor:default}
  .icon-btn:disabled:hover{background:none;color:var(--muted)}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .omni{
    flex:1;display:flex;align-items:center;gap:8px;height:32px;margin:0 4px;
    padding:0 10px;border-radius:10px;background:var(--bg-2);border:1px solid transparent;
    transition:border-color .12s ease, background .12s ease;
  }
  .omni:hover{background:var(--bg-hover)}
  .omni.focus{border-color:var(--accent);background:var(--bg)}
  .omni .lock{display:flex;align-items:center;color:var(--muted);flex:0 0 auto}
  .omni .lock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
  .omni .lock.insecure{color:#e3b341}
  .omni input{
    flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);
    font-family:inherit;font-size:13px;padding:0;
  }
  .omni input::placeholder{color:var(--muted)}
  .omni .host{color:var(--text);font-weight:560}
  .omni .rest{color:var(--muted)}
  .omni .hint{
    color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;min-width:0;pointer-events:none;
  }
  .omni .chip{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:6px;color:#fff;font-size:10px;font-weight:700;
  }
  /* Étoile remplie quand la page courante est dans les favoris. */
  .icon-btn.on{color:var(--accent)}
  .icon-btn.on svg{fill:var(--accent);stroke:var(--accent)}
  .progress{
    position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden;
    background:transparent;opacity:0;transition:opacity .2s;
  }
  .progress.on{opacity:1}
  .progress i{
    display:block;height:100%;width:35%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(320%)}
  }
  .popover{
    position:fixed;background:#212127;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;z-index:20;min-width:210px;
  }
  html[data-theme="light"] .popover{background:#fff}
  .popover .row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;cursor:default}
  .popover .row:hover{background:var(--bg-hover)}
  .popover .row .k{margin-left:auto;color:var(--muted);font-size:11px}
  .popover .sep{height:1px;background:var(--line);margin:5px 6px}
  .popover .lbl{padding:6px 9px 3px;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
  .hidden{display:none !important}
</style>

<style>
/* ==================================================================
   Habillage 1.3 — sobre et posé, dans l'esprit d'Arc.
   Cette couche est ajoutée après la feuille d'origine : elle retire les
   marqueurs « décoratifs » (dégradés, halos flous, ombres lourdes, pastilles
   pilule, survols qui font sauter les éléments) et aligne les composants sur
   une même grille de 4 px.
   ================================================================== */
  *{letter-spacing:-.006em}
  h1{font-size:19px;font-weight:640;letter-spacing:-.022em;margin:0 0 4px}
  h2{font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
  .lead{font-size:12.5px;line-height:1.55;color:var(--muted);margin-bottom:22px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
  .glow{display:none}

  /* --- cartes et lignes --- */
  .card{border:1px solid var(--line);border-radius:12px;box-shadow:none;overflow:hidden}
  .row{gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .txt b{font-weight:560}
  .row small{font-size:11.5px;line-height:1.5;margin-top:2px}

  /* --- boutons --- */
  .btn{
    height:28px;padding:0 11px;border-radius:7px;background:var(--card);border:1px solid var(--line);
    color:var(--text);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--card-hover);border-color:var(--line-2)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:550}
  .btn.primary:hover{background:#7c85ec;border-color:transparent}
  .btn.danger{color:var(--danger);border-color:rgba(229,83,75,.32);background:transparent}
  .btn.danger:hover{background:rgba(229,83,75,.10);border-color:rgba(229,83,75,.45)}

  /* --- interrupteurs --- */
  .switch{width:36px;height:20px;border-radius:999px;background:var(--switch-off)}
  .switch::after{width:14px;height:14px;top:3px;left:3px;box-shadow:0 1px 2px rgba(0,0,0,.22)}
  .switch.on{background:var(--accent)}
  .switch.on::after{transform:translateX(16px)}

  /* --- contrôles segmentés --- */
  .seg{border-radius:8px;padding:2px;background:var(--card-hover);border-color:var(--line)}
  .seg button{border-radius:6px;font-weight:500}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.16)}
  html[data-theme="light"] .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(16,17,22,.08)}

  /* --- pastilles et étiquettes --- */
  .badge{border-radius:6px;font-weight:500;padding:2px 7px}

  /* --- tableaux --- */
  table{font-size:12.5px}
  td{padding:8px 0}
  kbd{border-radius:5px;font-size:10.5px}
</style>
<style>
/* ---------- habillage 1.3 : barre d'adresse fine ---------- */
  .bar{gap:6px;padding:0 8px}
  .icon-btn{width:28px;height:28px;border-radius:7px;color:var(--muted)}
  .icon-btn:hover{background:var(--bg-hover);color:var(--text)}
  .omni{height:30px;border-radius:8px;background:var(--bg-2);border-color:transparent}
  .omni:focus-within{background:var(--bg-2);border-color:var(--line-2);
    box-shadow:0 0 0 3px rgba(107,117,232,.16)}
  .lock{color:var(--muted)}
  .hint{font-size:12.5px}
  .chip{width:20px;height:20px;border-radius:5px;font-size:10.5px;font-weight:600;color:var(--muted)}
  .progress{border-radius:0}
</style>
</head>
<body>
<div class="bar">
  <div class="nav">
    <button class="icon-btn" id="back" title="Précédent (Alt+←)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="fwd" title="Suivant (Alt+→)">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn" id="reload" title="Recharger (Ctrl+R / F5)">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 5v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="home" title="Page d'accueil">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
    </button>
  </div>

  <form class="omni" id="omniWrap" autocomplete="off">
    <span class="lock" id="lock" title="Connexion sécurisée">
      <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
    </span>
    <input id="url" type="text" spellcheck="false" autocapitalize="off" placeholder="Rechercher ou saisir une adresse">
    <span class="hint" id="hint"></span>
    <span class="chip" id="chip" title="Moteur de recherche">G</span>
  </form>

  <button class="icon-btn" id="star" title="Ajouter aux favoris">
    <svg viewBox="0 0 24 24"><path d="M12 4.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2-4.6-2.5-4.6 2.5.9-5.2L4.5 10l5.2-.7z"/></svg>
  </button>
  <button class="icon-btn" id="menuBtn" title="Menu">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
  </button>

  <div class="progress" id="progress"><i></i></div>
</div>

<div class="popover hidden" id="menuPop">
  <div class="lbl">Onglet</div>
  <div class="row" data-cmd="new_tab">Nouvel onglet<span class="k">Ctrl+T</span></div>
  <div class="row" data-cmd="duplicate">Dupliquer l'onglet</div>
  <div class="row" data-cmd="reopen">Rouvrir l'onglet fermé<span class="k">Ctrl+Maj+T</span></div>
  <div class="sep"></div>
  <div class="lbl">Affichage</div>
  <div class="row" data-cmd="zoom_in">Zoom avant<span class="k">Ctrl++</span></div>
  <div class="row" data-cmd="zoom_out">Zoom arrière<span class="k">Ctrl+-</span></div>
  <div class="row" data-cmd="toggle_favorite" id="favRow">Ajouter aux favoris<span class="k">Ctrl+D</span></div>
  <div class="row" data-cmd="zoom_reset">Zoom 100 %<span class="k">Ctrl+0</span></div>
  <div class="row" data-cmd="fullscreen">Plein écran<span class="k">F11</span></div>
  <div class="sep"></div>
  <div class="lbl">Nova</div>
  <div class="row" data-cmd="history">Historique<span class="k">Ctrl+H</span></div>
  <div class="row" data-cmd="settings">Paramètres<span class="k">Ctrl+,</span></div>
  <div class="row" data-cmd="devtools">Outils de développement<span class="k">F12</span></div>
  <div class="row" data-cmd="find">Rechercher dans la page<span class="k">Ctrl+F</span></div>
  <div class="sep"></div>
  <div class="row" data-cmd="quit">Quitter Nova<span class="k">Alt+F4</span></div>
</div>

<script>
(function(){
  "use strict";
  let state = null;
  let editing = false;

  const $ = (id) => document.getElementById(id);
  const post = (obj) => {
    const json = JSON.stringify(obj);
    try { window.ipc.postMessage(json); }
    catch (e) { try { window.chrome.webview.postMessage(json); } catch (e2) {} }
  };

  const ICONS = {
    lock: '<rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
    unlock: '<path d="M5 10.5h14v9H5z"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.7-1.4"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>'
  };

  function prettyUrl(url){
    if (!url) return {host:"Nouvel onglet", rest:""};
    if (url.indexOf("nova://") === 0) return {host:"nova", rest:url.slice(7)};
    try {
      const u = new URL(url);
      return {host:u.hostname, rest:(u.pathname === "/" ? "" : u.pathname) + (u.search || "")};
    } catch (e) {
      return {host:url, rest:""};
    }
  }

  /* Les deux segments hôte / chemin sont créés une fois puis seulement
     réécrits : plus d'allocation de DOM à chaque événement de la page. */
  const hostSpan = document.createElement("span");
  hostSpan.className = "host";
  const restSpan = document.createElement("span");
  restSpan.className = "rest";

  function paintOmnibox(active){
    if (editing) return;
    const url = active.url || "";
    const box = $("hint");
    if (active.search_mode) {
      $("url").value = "";
      $("url").placeholder = url || "Rechercher ou saisir une adresse";
      box.textContent = "";
      return;
    }
    const p = prettyUrl(url);
    $("url").value = "";
    $("url").placeholder = "";
    if (box.firstChild !== hostSpan) {
      box.textContent = "";
      box.append(hostSpan, restSpan);
    }
    if (hostSpan.textContent !== p.host) hostSpan.textContent = p.host;
    const rest = p.rest.length > 90 ? p.rest.slice(0, 90) + "…" : p.rest;
    if (restSpan.textContent !== rest) restSpan.textContent = rest;
  }

  window.NovaUI = {
    render(next){
      const first = state === null;
      state = next;
      /* `dark` est résolu par Rust (« Système » -> clair ou sombre). */
      const dark = (typeof next.dark === "boolean") ? next.dark : next.theme !== "light";
      document.documentElement.dataset.theme = dark ? "dark" : "light";

      const a = next.active;
      $("back").disabled = !a.can_back;
      $("fwd").disabled = !a.can_forward;
      $("reload").classList.toggle("spin", !!a.loading);
      $("reload").title = a.loading ? "Arrêter le chargement" : "Recharger (Ctrl+R / F5)";

      const eng = (next.engines || []).find((e) => e.id === a.engine) || {color:"#666", name:"?"};
      $("chip").style.background = eng.color;
      $("chip").textContent = eng.name.charAt(0).toUpperCase();
      $("chip").title = "Recherches : " + eng.name + " (Alt+Entrée pour un autre moteur)";

      const lock = $("lock");
      if (lock._secure !== a.secure) {
        lock._secure = a.secure;
        lock.innerHTML = '<svg viewBox="0 0 24 24">' + (a.secure ? ICONS.lock : ICONS.unlock) + '</svg>';
        lock.classList.toggle("insecure", !a.secure);
        lock.title = a.secure ? "Connexion chiffrée" : "Connexion non chiffrée";
      }

      /* Favoris : étoile remplie + libellé de menu cohérent. */
      const fav = !!a.is_favorite;
      $("star").classList.toggle("on", fav);
      $("star").title = fav ? "Retirer des favoris" : "Ajouter aux favoris (Ctrl+D)";
      $("favRow").textContent = fav ? "Retirer des favoris" : "Ajouter aux favoris";
      const kbd = document.createElement("span");
      kbd.className = "k";
      kbd.textContent = "Ctrl+D";
      $("favRow").appendChild(kbd);

      /* Couleur de fond choisie dans les paramètres (vide = thème standard). */
      if (window.NovaSkin) window.NovaSkin.apply(next.ui_bg);

      $("progress").classList.toggle("on", !!a.loading);
      paintOmnibox(a);
      if (first) { /* rien : pas de focus volé au démarrage */ }
    },
    focusOmnibox(){
      const input = $("url");
      editing = true;
      input.value = (state && state.active && state.active.url) || "";
      $("omniWrap").classList.add("focus");
      input.focus();
      input.select();
    },
    blurOmnibox(){
      editing = false;
      $("omniWrap").classList.remove("focus");
      if (state) paintOmnibox(state.active);
    },
    blinkStop(){ $("reload").classList.remove("spin"); }
  };

  const input = $("url");
  input.addEventListener("focus", () => { editing = true; $("omniWrap").classList.add("focus"); input.select(); });
  input.addEventListener("blur", () => { editing = false; $("omniWrap").classList.remove("focus"); if (state) paintOmnibox(state.active); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const text = input.value.trim();
      if (text) post({cmd:"navigate", text:text, alt:e.altKey});
      input.blur();
    } else if (e.key === "Escape") {
      if (state) paintOmnibox(state.active);
      input.blur();
    }
  });

  $("back").addEventListener("click", () => post({cmd:"back"}));
  $("fwd").addEventListener("click", () => post({cmd:"forward"}));
  $("reload").addEventListener("click", () => post({cmd:(state && state.active.loading) ? "stop" : "reload"}));
  $("home").addEventListener("click", () => post({cmd:"home"}));
  /* L'étoile gère désormais les favoris (le copier-coller d'adresse reste
     dans le menu contextuel des onglets et de la barre d'adresse). */
  $("star").addEventListener("click", () => post({cmd:"toggle_favorite"}));

  function togglePop(){
    const pop = $("menuPop");
    const open = pop.classList.contains("hidden");
    if (!open) { pop.classList.add("hidden"); return; }
    pop.classList.remove("hidden");
    const r = $("menuBtn").getBoundingClientRect();
    pop.style.top = (r.bottom + 6) + "px";
    pop.style.left = Math.max(8, r.right - pop.offsetWidth) + "px";
  }
  $("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePop(); });
  $("menuPop").addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    $("menuPop").classList.add("hidden");
    post({cmd:row.dataset.cmd});
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".popover") && !e.target.closest("#menuBtn")) $("menuPop").classList.add("hidden");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") $("menuPop").classList.add("hidden");
  });
})();
</script>
</body>
</html>
