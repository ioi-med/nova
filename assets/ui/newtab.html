<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Nouvel onglet</title>
<style>
  :root{
    --bg:#1a1b1f; --card:#202127; --card-hover:#26272e; --text:#eceef2; --muted:#9a9ca7;
    --line:#2b2c33; --line-2:#35363e; --accent:#6b75e8; --accent-2:#6b75e8; --danger:#e5534b;
    --font:"Segoe UI Variable Text","Segoe UI",Inter,-apple-system,system-ui,Roboto,sans-serif;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8; --card:#ffffff; --card-hover:#f1f2f5; --text:#15161a; --muted:#5f616d;
    --line:#e2e4e9; --line-2:#d5d8de;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:var(--font); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:26px; padding:40px 24px; user-select:none;
  }
  .glow{
    position:fixed; inset:-30% 20% 40% 20%; pointer-events:none; filter:blur(90px); opacity:.35;
    background:radial-gradient(circle at 30% 30%, #7a6bff 0%, transparent 55%),
               radial-gradient(circle at 70% 20%, #3ac1ff 0%, transparent 50%);
  }
  html[data-theme="light"] .glow{opacity:.18}
  .hero{display:flex;align-items:center;gap:11px;z-index:1}
  .hero svg{width:30px;height:30px}
  .hero h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.3px}
  .searchwrap{width:min(680px,90vw);z-index:1;display:flex;flex-direction:column;gap:12px}
  form{
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;
    background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  form:focus-within{border-color:var(--accent)}
  form svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9}
  input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:15px;font-family:inherit}
  input::placeholder{color:var(--muted)}
  .engines{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12.5px;cursor:pointer;
  }
  .pill:hover{background:var(--card-hover);color:var(--text)}
  .pill.on{border-color:var(--accent);color:var(--text)}
  .pill .sw{width:14px;height:14px;border-radius:4px;overflow:hidden;flex:0 0 auto}
  .section{width:min(680px,90vw);z-index:1}
  .section h2{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:13px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;text-decoration:none;color:var(--text);
  }
  .tile:hover{background:var(--card-hover);transform:translateY(-2px)}
  .tile .fav{
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff;position:relative;overflow:hidden;
  }
  /* Le favicon recouvre la lettre de repli et reste dans le carré. */
  .tile .fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .tile .fav.has-img{background:var(--fav-plate)}
  .tile .fav.has-img .letter{visibility:hidden}
  .tile span{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tips{
    width:min(680px,90vw);z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;color:var(--muted);font-size:11.5px;
  }
  .tips div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .tips b{color:var(--text);font-weight:600}
  kbd{
    display:inline-block;padding:1px 5px;border-radius:5px;background:var(--card-hover);
    border:1px solid var(--line);font-family:inherit;font-size:10.5px;color:var(--text);
  }
  footer{color:var(--muted);font-size:11px;z-index:1}

  /* ---------- habillage 1.3 : page de démarrage posée ---------- */
  body{gap:22px;justify-content:flex-start;padding:10vh 24px 48px}
  .hero svg{width:26px;height:26px}
  .hero h1{font-size:21px;font-weight:640;letter-spacing:-.024em}
  .searchwrap{gap:14px}
  form{padding:11px 14px;border-radius:10px;box-shadow:none;background:var(--card)}
  form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(107,117,232,.16)}
  input{font-size:14px}
  .pill{height:28px;padding:0 11px;border-radius:7px;background:transparent;border-color:transparent;color:var(--muted)}
  .pill:hover{background:var(--card-hover);border-color:transparent;color:var(--text)}
  .pill.on{background:var(--card-hover);border-color:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
  .pill .sw{width:14px;height:14px;border-radius:4px}
  .pill .sw img{width:100%;height:100%;display:block}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .tile{padding:12px 8px;border-radius:11px;gap:7px;border-color:var(--line)}
  .tile:hover{background:var(--card-hover);border-color:var(--line-2);transform:none}
  .tile .fav{width:28px;height:28px;border-radius:8px;font-size:12px}
  .tile span{font-size:11.5px;color:var(--muted)}
  .tile:hover span{color:var(--text)}
  .tips{gap:8px}
  .tips div{border-radius:10px;padding:10px 12px;background:transparent;border-color:var(--line)}
  .tips b{font-weight:560}
</style>

<style>
/* ==================================================================
   Habillage 1.3 — sobre et posé, dans l'esprit d'Arc.
   Cette couche est ajoutée après la feuille d'origine : elle retire les
   marqueurs « décoratifs » (dégradés, halos flous, ombres lourdes, pastilles
   pilule, survols qui font sauter les éléments) et aligne les composants sur
   une même grille de 4 px.
   ================================================================== */
  *{letter-spacing:-.006em}
  h1{font-size:19px;font-weight:640;letter-spacing:-.022em;margin:0 0 4px}
  h2{font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
  .lead{font-size:12.5px;line-height:1.55;color:var(--muted);margin-bottom:22px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
  .glow{display:none}

  /* --- cartes et lignes --- */
  .card{border:1px solid var(--line);border-radius:12px;box-shadow:none;overflow:hidden}
  .row{gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .txt b{font-weight:560}
  .row small{font-size:11.5px;line-height:1.5;margin-top:2px}

  /* --- boutons --- */
  .btn{
    height:28px;padding:0 11px;border-radius:7px;background:var(--card);border:1px solid var(--line);
    color:var(--text);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--card-hover);border-color:var(--line-2)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:550}
  .btn.primary:hover{background:#7c85ec;border-color:transparent}
  .btn.danger{color:var(--danger);border-color:rgba(229,83,75,.32);background:transparent}
  .btn.danger:hover{background:rgba(229,83,75,.10);border-color:rgba(229,83,75,.45)}

  /* --- interrupteurs --- */
  .switch{width:36px;height:20px;border-radius:999px;background:var(--switch-off)}
  .switch::after{width:14px;height:14px;top:3px;left:3px;box-shadow:0 1px 2px rgba(0,0,0,.22)}
  .switch.on{background:var(--accent)}
  .switch.on::after{transform:translateX(16px)}

  /* --- contrôles segmentés --- */
  .seg{border-radius:8px;padding:2px;background:var(--card-hover);border-color:var(--line)}
  .seg button{border-radius:6px;font-weight:500}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.16)}
  html[data-theme="light"] .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(16,17,22,.08)}

  /* --- pastilles et étiquettes --- */
  .badge{border-radius:6px;font-weight:500;padding:2px 7px}

  /* --- tableaux --- */
  table{font-size:12.5px}
  td{padding:8px 0}
  kbd{border-radius:5px;font-size:10.5px}
</style>
</head>
<body>
<div class="hero">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.6" fill="var(--accent)"/>
    <path d="M8.7 16.3V8.1l6.6 8.2V8.1" fill="none" stroke="#fff" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Nova</h1>
</div>

<div class="searchwrap">
  <form id="searchForm">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4" stroke-linecap="round"/></svg>
    <input id="q" type="text" placeholder="Rechercher sur le Web (Entrée) — ou tapez une adresse" autofocus spellcheck="false">
  </form>
  <div class="engines" id="enginePills"></div>
</div>

<section class="section hidden" id="favorites">
  <h2>Favoris</h2>
  <div class="grid" id="favGrid"></div>
</section>

<section class="section">
  <h2>Sites fréquents</h2>
  <div class="grid" id="topSites">
    <div style="color:var(--muted);font-size:12px">Votre historique alimentera cette zone.</div>
  </div>
</section>

<div class="tips">
  <div><b>Onglets à gauche</b> : la liste complète est dans la barre latérale.</div>
  <div><b>Nouvel onglet</b> : <kbd>Ctrl</kbd>+<kbd>T</kbd> — <b>Fermer</b> : <kbd>Ctrl</kbd>+<kbd>W</kbd></div>
  <div><b>Barre d'adresse</b> : <kbd>Ctrl</kbd>+<kbd>L</kbd></div>
  <div><b>Changer de moteur</b> : <kbd>!b</kbd> texte, <kbd>!e</kbd> texte…</div>
</div>

<footer id="foot"></footer>

<script>
(function(){
  "use strict";
  function hostOf(url){
    try { return new URL(url).hostname || url; } catch (e) { return url; }
  }
  function tint(str){
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return "hsl(" + h + ",58%,48%)";
  }

  const N = window.__NOVA__ || {config:{engine:"google"}, engines:[], topsites:[], favorites:[]};
  const post = (obj) => {
    const json = JSON.stringify(obj);
    try { window.ipc.postMessage(json); }
    catch (e) { try { window.chrome.webview.postMessage(json); } catch (e2) {} }
  };
  /* `dark` est résolu par Rust (« Système » -> clair ou sombre). */
  const dark = (typeof N.dark === "boolean") ? N.dark : N.config.theme !== "light";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (window.NovaSkin) window.NovaSkin.apply(N.ui_bg);

  let engine = N.config.engine;

  function renderPills(){
    const box = document.getElementById("enginePills");
    box.textContent = "";
    N.engines.slice(0,6).forEach((e) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill" + (e.id === engine ? " on" : "");
      const sw = document.createElement("span");
      sw.className = "sw";
      if (window.NovaEngineIcon) window.NovaEngineIcon(sw, e);
      else sw.style.background = e.color;
      const t = document.createElement("span");
      t.textContent = e.name;
      b.append(sw, t);
      b.title = "Chercher avec " + e.name + " (raccourci " + e.bang + ")";
      b.addEventListener("click", () => { engine = e.id; renderPills(); post({cmd:"set_engine", engine:e.id}); document.getElementById("q").focus(); });
      box.appendChild(b);
    });
  }
  renderPills();

  document.getElementById("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = document.getElementById("q").value.trim();
    if (q) post({cmd:"navigate", text:q, engine:engine});
  });

  /* Favoris (apps) : rangée affichée avant les sites fréquents. */
  (function renderFavorites(){
    const favs = N.favorites || [];
    const box = document.getElementById("favorites");
    if (!favs.length) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    const grid = document.getElementById("favGrid");
    favs.forEach((f) => {
      const host = hostOf(f.url);
      const a = document.createElement("a");
      a.className = "tile";
      a.href = "#";
      const fav = document.createElement("div");
      fav.className = "fav";
      const fallback = document.createElement("span");
      fallback.className = "letter";
      fallback.textContent = ((f.title || host || "?").trim().charAt(0) || "?").toUpperCase();
      fav.appendChild(fallback);
      fav.style.background = tint(host);
      if (f.url.indexOf("http") === 0 && host.indexOf(".") !== -1) {
        const img = document.createElement("img");
        img.alt = "";
        img.src = "https://" + host + "/favicon.ico";
        img.addEventListener("error", () => { img.remove(); fav.classList.remove("has-img"); fav.style.background = tint(host); });
        img.addEventListener("load", () => { fav.classList.add("has-img"); fav.style.background = ""; });
        fav.appendChild(img);
      }
      const label = document.createElement("span");
      label.textContent = (f.title || host).slice(0, 24);
      a.append(fav, label);
      a.title = f.url;
      a.addEventListener("click", (e) => { e.preventDefault(); post({cmd:"open_url", url:f.url, new_tab:false}); });
      a.addEventListener("auxclick", (e) => { if (e.button === 1) post({cmd:"open_url", url:f.url, new_tab:true}); });
      grid.appendChild(a);
    });
  })();

  const grid = document.getElementById("topSites");
  const sites = N.topsites || [];
  if (sites.length) {
    grid.textContent = "";
    sites.slice(0,12).forEach((s) => {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = "#";
      const host = s.host || s.url;
      const letter = (s.title || host || "?").trim().charAt(0).toUpperCase();
      const fav = document.createElement("div");
      fav.className = "fav";
      let hash = 0;
      for (let i = 0; i < host.length; i++) hash = (hash * 31 + host.charCodeAt(i)) % 360;
      fav.style.background = "hsl(" + hash + ",58%,48%)";
      fav.textContent = letter;
      const label = document.createElement("span");
      label.textContent = host.replace(/^www\./, "");
      a.append(fav, label);
      a.title = s.url;
      a.addEventListener("click", (e) => { e.preventDefault(); post({cmd:"open_url", url:s.url, new_tab:false}); });
      a.addEventListener("auxclick", (e) => { if (e.button === 1) post({cmd:"open_url", url:s.url, new_tab:true}); });
      grid.appendChild(a);
    });
  }

  document.getElementById("foot").textContent =
    "Nova " + (N.version || "") + " — moteur de rendu WebView2/Chromium · accélérateur natif : " + (N.backend || "—");
})();
</script>
</body>
</html>
